name: Approved source shadow probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-collection-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install pipeline dependencies
        run: python -m pip install --constraint constraints/py312.txt -e .

      - name: Install contract validator dependencies
        run: npm ci

      - name: Probe approved sources without publication
        continue-on-error: true
        run: python -m scripts.approved_cloud_probe

      - name: Collect, score, and validate an approved-source candidate
        id: shadow
        run: python -m scripts.approved_cloud_shadow

      - name: Save the validated shadow candidate for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-cloud-shadow-${{ github.sha }}
          path: |
            ${{ steps.shadow.outputs.artifact_path }}/publication
            ${{ steps.shadow.outputs.artifact_path }}/NOTICE.md
          retention-days: 5
