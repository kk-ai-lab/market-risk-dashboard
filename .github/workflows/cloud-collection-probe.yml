name: Approved source shadow probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-collection-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: python -m pip install --constraint constraints/py312.txt -e .
      - name: Probe approved sources without publication
        run: python -m scripts.approved_cloud_probe
