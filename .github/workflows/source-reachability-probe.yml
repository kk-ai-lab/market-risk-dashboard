name: Source reachability probe

# Reports whether approved data hosts answer from Actions egress. It is a
# report, not a merge gate: the probe always exits 0 and saves no state.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-reachability-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: python -m pip install --constraint constraints/py312.txt -e .

      - name: Probe approved source hosts
        env:
          DATA_FRED_API_KEY: ${{ secrets.DATA_FRED_API_KEY }}
        run: python scripts/probe_source_reachability.py
